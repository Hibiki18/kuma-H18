<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>kuma · 游戏</title>
  <style>
    :root { color-scheme: dark; font-family: "Microsoft YaHei UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #050708; color: #dce8ed; }
    body { display: grid; grid-template-rows: 40px minmax(0, 1fr); }
    header { display: flex; align-items: center; gap: 6px; padding: 0 8px; border-bottom: 1px solid #26343b; background: #0d1318; }
    button { height: 28px; padding: 0 10px; border: 1px solid #35464f; border-radius: 4px; background: #111a20; color: #dce8ed; cursor: pointer; }
    button:hover { border-color: #55b7df; color: #7dcdf0; } button:disabled { opacity: .45; cursor: default; }
    #window-status { min-width: 0; margin-left: auto; overflow: hidden; color: #91a3ac; font-size: 11px; white-space: nowrap; text-overflow: ellipsis; }
    #detached-game-area { min-width: 0; min-height: 0; background: #050708; }
  </style>
</head>
<body>
  <header>
    <button id="btn-attach" title="把同一游戏会话收回工作台">收回工作台</button>
    <button id="btn-reload" title="刷新游戏页面">刷新</button>
    <button id="btn-capture" title="保存游戏画面截图">截图</button>
    <span id="window-status" role="status"></span>
  </header>
  <main id="detached-game-area"></main>
  <script src="./game-window.js"></script>
</body>
</html>
