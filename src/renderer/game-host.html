<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>kuma 游戏宿主</title>
  <style>
    :root {
      color-scheme: dark; font-family: "Microsoft YaHei UI", sans-serif;
      --voice-dmg-light: #ffe9a0;
      --voice-dmg-mid: #ffc46b;
      --voice-dmg-heavy: #ff8585;
      --voice-dmg-sunk: #c5a3f0;
      --wedding: #ff8fd6;
      --wedding-lit: #ffe0f3;
      --motion-fast: 150ms;
    }
    * { box-sizing: border-box; }
    html, body, #game-host { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #050708; }
    #game-host { display: grid; place-items: center; container-type: size; }
    #game-wrapper { position: relative; width: min(100cqw, calc(100cqh * 5 / 3)); aspect-ratio: 5 / 3; overflow: hidden; background: #000; }
    #game-webview { position: absolute; inset: 0; width: 100%; height: 100%; }
    #voice-danmaku {
      position: absolute; z-index: 8; inset: 3.5% 0 auto; height: 42%;
      overflow: hidden; pointer-events: none; background: transparent;
    }
    #voice-danmaku .voice-danmaku-item {
      position: absolute; top: calc(var(--voice-lane) * 1.8em);
      display: block; width: max-content; max-width: none; white-space: nowrap;
      font-size: clamp(13px, 1.45vw, 19px); font-weight: 650; line-height: 1.55;
      letter-spacing: .01em;
      animation-duration: var(--voice-duration);
      animation-timing-function: linear;
      animation-fill-mode: forwards;
      text-shadow:
        -1px -1px 1px rgba(0, 0, 0, .96),
        1px -1px 1px rgba(0, 0, 0, .96),
        -1px 1px 1px rgba(0, 0, 0, .96),
        1px 1px 1px rgba(0, 0, 0, .96),
        0 2px 5px rgba(0, 0, 0, .92);
    }
    #voice-danmaku .voice-danmaku-item.friendly {
      left: 0; color: #b9f0e4; animation-name: voice-danmaku-ltr;
    }
    #voice-danmaku .voice-danmaku-item.enemy {
      right: 0; color: #ffc0c7; animation-name: voice-danmaku-rtl;
    }
    #voice-danmaku .voice-danmaku-item.dmg-light { color: var(--voice-dmg-light); }
    #voice-danmaku .voice-danmaku-item.dmg-mid { color: var(--voice-dmg-mid); }
    #voice-danmaku .voice-danmaku-item.dmg-heavy { color: var(--voice-dmg-heavy); }
    #voice-danmaku .voice-danmaku-item.dmg-sunk { color: var(--voice-dmg-sunk); }
    #voice-danmaku .voice-danmaku-item.voice-wedding { color: var(--wedding); }
    @keyframes voice-danmaku-ltr {
      from { left: 0; transform: translateX(-50%); }
      to { left: 100%; transform: translateX(0); }
    }
    @keyframes voice-danmaku-rtl {
      from { right: 0; transform: translateX(50%); }
      to { right: 100%; transform: translateX(0); }
    }
    #voice-subtitle {
      position: absolute; z-index: 7; left: 4%; right: 4%; bottom: 3.5%;
      display: block; pointer-events: none; background: transparent;
      color: #f4f8fb; text-align: center; font-size: clamp(13px, 1.55vw, 20px);
      font-weight: 650; line-height: 1.45; letter-spacing: .01em;
      opacity: 0; transform: translateY(7px);
      transition: opacity var(--motion-fast) ease, transform var(--motion-fast) ease;
      text-shadow:
        -1px -1px 1px rgba(0, 0, 0, .95),
        1px -1px 1px rgba(0, 0, 0, .95),
        -1px 1px 1px rgba(0, 0, 0, .95),
        1px 1px 1px rgba(0, 0, 0, .95),
        0 2px 5px rgba(0, 0, 0, .95);
    }
    #voice-subtitle.show { opacity: 1; transform: translateY(0); }
    #voice-subtitle .voice-subtitle-speaker { color: #8fe0cc; white-space: nowrap; }
    #voice-subtitle .voice-subtitle-line { overflow-wrap: anywhere; }
    #voice-subtitle.voice-wedding .voice-subtitle-line { color: var(--wedding); }
    #voice-subtitle.voice-wedding .voice-subtitle-speaker { color: var(--wedding-lit); }
    #game-following-effects { position: absolute; z-index: 6; inset: 0; display: none; background: #000; pointer-events: none; }
    #game-following-effects.armed { display: block; }
    #game-following-effects.running { animation: game-following-glow ease-in-out both; }
    @keyframes game-following-glow { 0% { opacity: 1; } 24% { opacity: .84; } 38% { opacity: .93; } 62% { opacity: .46; } 74% { opacity: .58; } 100% { opacity: 0; } }
    #lg-banners { position: absolute; z-index: 8; top: 8px; left: 8px; right: 8px; display: grid; gap: 5px; pointer-events: none; }
    .lg-banner { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; align-items: center; gap: 8px; min-height: 46px; padding: 6px 8px; border: 1px solid #a27b2c; background: rgba(16,22,25,.96); color: #edf5f7; box-shadow: 0 5px 20px rgba(0,0,0,.38); pointer-events: auto; }
    .lg-banner.danger { border-color: #b64d55; } .lg-banner.repair { border-color: #39966a; } .lg-banner.goddess { border-color: #63dca2; } .lg-banner.wedding { border-color: #e681ad; }
    .lg-banner .mark { text-align: center; font-size: 20px; }
    .lg-banner .copy { min-width: 0; display: grid; gap: 2px; font-size: 11px; }
    .lg-banner .copy b, .lg-banner .copy span { overflow-wrap: anywhere; }
    .lg-banner .copy span { color: #a9bac1; }
    .lg-banner .actions { display: flex; gap: 5px; }
    .lg-banner button { height: 26px; border: 1px solid #3b4c53; border-radius: 4px; background: #111a1e; color: #dce8ed; cursor: pointer; }
    #lg-toasts { position: absolute; z-index: 7; right: 12px; bottom: 12px; width: min(330px, 44%); display: grid; gap: 7px; }
    .lg-toast { position: relative; display: flex; gap: 8px; padding: 9px 30px 10px 10px; border: 1px solid #3a4850; background: rgba(12,18,22,.94); color: #dce8ed; box-shadow: 0 5px 20px rgba(0,0,0,.35); }
    .lg-toast.ok { border-color: #39785a; } .lg-toast.warn { border-color: #a37c32; } .lg-toast.danger { border-color: #a54c52; }
    .toast-body { min-width: 0; display: grid; gap: 3px; font-size: 11px; }
    .toast-body b { overflow-wrap: anywhere; font-size: 12px; }
    .toast-body .detail { color: #9bacb5; overflow-wrap: anywhere; }
    .toast-close, .toast-action { border: 0; background: transparent; color: #9bacb5; cursor: pointer; }
    .toast-close { position: absolute; top: 4px; right: 5px; width: 24px; height: 24px; font-size: 18px; }
    .toast-action { justify-self: start; padding: 2px 0; color: #65bde5; }
    .ttl { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: #65bde5; }
    #game-overlay { position: absolute; z-index: 10; inset: 0; display: none; place-content: center; justify-items: center; gap: 10px; padding: 24px; background: rgba(5,8,10,.93); text-align: center; }
    #game-overlay.visible { display: grid; }
    #overlay-title { color: #ff7d83; font-weight: 700; }
    #overlay-detail { max-width: 720px; color: #9bacb5; white-space: pre-wrap; overflow-wrap: anywhere; font: 12px Consolas, monospace; }
    #btn-retry { padding: 6px 14px; border: 1px solid #3a5967; border-radius: 4px; background: #10191e; color: #dce8ed; cursor: pointer; }
    @media (prefers-reduced-motion: reduce) { #voice-subtitle { transition: none; } .voice-danmaku-item { animation: none; } }
  </style>
</head>
<body>
  <main id="game-host">
    <div id="game-wrapper">
      <div id="voice-danmaku" aria-live="polite"></div>
      <div id="voice-subtitle" aria-live="polite"><span class="voice-subtitle-speaker"></span><span aria-hidden="true">：</span><span class="voice-subtitle-line"></span></div>
      <div id="game-following-effects" aria-hidden="true"></div>
      <div id="lg-banners" aria-live="assertive"></div>
      <div id="lg-toasts" aria-live="polite"></div>
      <div id="game-overlay"><div id="overlay-title"></div><div id="overlay-detail"></div><button id="btn-retry">重试</button></div>
    </div>
  </main>
  <script src="./game-host.js"></script>
</body>
</html>
