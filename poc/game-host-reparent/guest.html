<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    html, body { width: 100%; height: 100%; margin: 0; background: #132128; color: #e4f2f6; }
    body { font: 14px "Microsoft YaHei UI", sans-serif; }
    #probe-input { position: absolute; top: 20px; left: 20px; width: 240px; height: 34px; }
    #probe-button { position: absolute; top: 70px; left: 20px; width: 120px; height: 34px; }
    iframe { position: absolute; left: 20px; bottom: 20px; width: 240px; height: 100px; border: 1px solid #526971; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="probe-canvas" width="1200" height="720"></canvas>
  <input id="probe-input" aria-label="input probe">
  <button id="probe-button" type="button">pointer probe</button>
  <iframe src="/frame.html"></iframe>
  <script>
    const state = window.__poc = {
      instance: crypto.randomUUID(),
      requestSeq: 0,
      inputEvents: 0,
      pointerEvents: 0,
      wheelEvents: 0,
      audioInstance: crypto.randomUUID(),
    }
    const input = document.querySelector('#probe-input')
    input.addEventListener('input', () => { state.inputEvents += 1 })
    document.querySelector('#probe-button').addEventListener('click', () => { state.pointerEvents += 1 })
    addEventListener('wheel', () => { state.wheelEvents += 1 })

    const canvas = document.querySelector('#probe-canvas')
    const context = canvas.getContext('2d')
    context.fillStyle = '#132128'
    context.fillRect(0, 0, canvas.width, canvas.height)
    context.fillStyle = '#62b9d9'
    context.fillRect(0, 0, 40, 40)
    context.fillStyle = '#f6c75c'
    context.fillRect(canvas.width - 40, canvas.height - 40, 40, 40)

    const AudioContextClass = window.AudioContext || window.webkitAudioContext
    const audio = new AudioContextClass()
    const oscillator = audio.createOscillator()
    const gain = audio.createGain()
    gain.gain.value = 0.00001
    oscillator.connect(gain).connect(audio.destination)
    oscillator.start()
    audio.resume().catch(() => {})
    state.audio = audio

    let timer = setInterval(() => {
      const seq = ++state.requestSeq
      const xhr = new XMLHttpRequest()
      xhr.open('GET', `/kcsapi/poc?seq=${seq}`)
      xhr.send()
    }, 50)
    state.stop = () => {
      clearInterval(timer)
      timer = 0
    }
    state.snapshot = () => ({
      instance: state.instance,
      requestSeq: state.requestSeq,
      inputEvents: state.inputEvents,
      pointerEvents: state.pointerEvents,
      wheelEvents: state.wheelEvents,
      inputValue: input.value,
      activeElement: document.activeElement && document.activeElement.id,
      audioInstance: state.audioInstance,
      audioState: audio.state,
      audioTime: audio.currentTime,
      preloadAudioHook: window.kansoAudioControlInstalled === true,
      iframeInstance: document.querySelector('iframe').contentWindow.__frameInstance,
    })
  </script>
</body>
</html>
